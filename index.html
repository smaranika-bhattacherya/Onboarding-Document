<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airtribe Learner Onboarding Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5FD}
*{box-sizing:border-box}
a{color:#4C2CD6}a:hover{color:#3A1FB0}
button{font-family:inherit;cursor:pointer}
.root{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;color:#1A1640;min-height:100vh;background:linear-gradient(180deg,#ECE8FF 0px,#F4F2FE 280px,#F7F7FC 100%)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-0.01em}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#6D4AFF,#2F6BFF);display:flex;align-items:center;justify-content:center}
.brand-sub{font-weight:600;font-size:13px;color:#575474;padding:6px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #E4E1F5}
.progress{margin-top:18px;background:#FFFFFF;border:1px solid #E4E1F5;border-radius:16px;padding:14px 16px}
.progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:13px}
.progress-label{font-weight:700;color:#1A1640}
.progress-meta{color:#575474;font-weight:500}
.bar{height:8px;border-radius:999px;background:#EEEBFB;margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#6D4AFF,#2F6BFF);transition:width .4s ease}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.nav-btn{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid #E4E1F5;background:#FFFFFF;color:#575474;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:all .2s ease}
.nav-btn:hover{border-color:#B9AEF5;color:#3A1FB0}
.nav-btn.is-done{background:#F1EEFF;color:#4C2CD6;border-color:#DCD5FB}
.nav-btn.is-current{background:#4C2CD6;color:#FFFFFF;border-color:#4C2CD6}
.nav-name{font-weight:600;font-size:13px}
.card{margin-top:18px;background:#FFFFFF;border:1px solid #E4E1F5;border-radius:24px;padding:36px 36px 28px;box-shadow:0 1px 2px rgba(26,22,64,.04),0 12px 32px -12px rgba(76,44,214,.12)}
.sec{animation:secIn .4s ease}
@keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4C2CD6;background:#F1EEFF;padding:6px 12px;border-radius:999px}
.h1{font-size:44px;line-height:1.08;letter-spacing:-0.025em;font-weight:800;margin:16px 0 0}
.h2{font-size:34px;line-height:1.12;letter-spacing:-0.02em;font-weight:800;margin:14px 0 0}
.lead{font-size:17px;line-height:1.6;color:#4A4766;margin:12px 0 0;max-width:720px}
.grid{display:flex;flex-wrap:wrap;gap:28px;margin-top:28px;align-items:flex-start}
.col-vis{flex:1 1 340px;min-width:0}
.col-main{flex:1.25 1 400px;min-width:0}
.panel{border-radius:20px;background:#F7F5FF;border:1px solid #E8E3FB;padding:20px}
.cap{font-size:12px;font-weight:600;color:#575474;margin:10px 2px 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#FFF4D6;color:#7A5300}
.acc-stack{display:flex;flex-direction:column;gap:10px}
.acc{border:1px solid #E4E1F5;border-radius:16px;background:#FFFFFF;transition:border-color .2s ease,box-shadow .2s ease}
.acc:hover{border-color:#CFC6F7}
.acc.is-open{border-color:#8F78F2;box-shadow:0 8px 24px -14px rgba(76,44,214,.45)}
.acc-head{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;background:none;border:0;text-align:left;color:#1A1640;border-radius:16px}
.badge{flex:none;width:34px;height:34px;border-radius:10px;background:#F1EEFF;color:#4C2CD6;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.acc.is-open .badge{background:#4C2CD6;color:#FFFFFF}
.acc-titles{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.acc-title{font-weight:700;font-size:16px;line-height:1.3}
.acc-sub{font-size:13px;color:#575474;font-weight:500}
.chev{flex:none;color:#7A76A0;transition:transform .25s ease}
.acc.is-open .chev{transform:rotate(180deg);color:#4C2CD6}
.acc-body{padding:0 16px 16px 64px;animation:reveal .28s ease}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acc-lead{margin:0;font-size:15px;line-height:1.6;color:#3B3858}
.acc-bl{margin:12px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#575474}
.acc-list{margin:8px 0 0;padding-left:18px;font-size:15px;line-height:1.7;color:#3B3858}
.acc-note{margin:12px 0 0;font-size:13px;line-height:1.5;color:#575474;background:#F7F5FF;border-radius:10px;padding:10px 12px}
.link-btn{margin-top:12px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #DCD5FB;background:#F7F5FF;color:#4C2CD6;font-weight:700;font-size:14px}
.link-btn:hover{background:#EDE8FF}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:10px;transition:transform .15s ease,box-shadow .2s ease}
.btn-primary{background:linear-gradient(135deg,#5B3BE8,#2F6BFF);color:#FFFFFF;box-shadow:0 10px 24px -10px rgba(76,44,214,.6)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:#FFFFFF;color:#3A1FB0;border:1px solid #DCD5FB}
.btn-ghost:hover{background:#F7F5FF}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid #EEEBF8;flex-wrap:wrap}
.foot-spacer{flex:1}
.takeaway{margin-top:20px;display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,#F3F0FF,#EAF1FF);border:1px solid #DED7FB}
.takeaway-k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#4C2CD6}
.takeaway-t{margin:4px 0 0;font-size:16px;font-weight:600;line-height:1.5;color:#1A1640}
.ico{flex:none;width:40px;height:40px;border-radius:12px;background:#FFFFFF;border:1px solid #E4E1F5;color:#4C2CD6;display:flex;align-items:center;justify-content:center}
.phase{margin-top:18px}
.phase-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.phase-tag{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.phase-note{font-size:13px;color:#575474;font-weight:500}
.ph-early .phase-tag{background:#EDE8FF;color:#3A1FB0}
.ph-wk2 .phase-tag{background:#E3EDFF;color:#1D4ED8}
.ph-ongoing .phase-tag{background:#ECEDF3;color:#3B3F55}
.ph-wk10 .phase-tag{background:linear-gradient(135deg,#4C2CD6,#2F6BFF);color:#FFFFFF}
.tl{display:flex;flex-direction:column;gap:10px;padding-left:16px;border-left:2px dashed #D9D2FA;margin-left:10px}
.ph-wk2 .tl{border-left-color:#BFD3FF}
.ph-ongoing .tl{border-left-color:#D5D7E2}
.ph-wk10 .tl{border-left-color:#9DB7FF}
.hot-frame{border-radius:16px;background:#FFFFFF;border:1px solid #E4E1F5;overflow:hidden}
.hot-top{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid #EEEBF8;background:#FBFAFF;font-size:12px;font-weight:600;color:#575474}
.dot{width:8px;height:8px;border-radius:50%;background:#D9D5EA}
.hot-body{display:flex;gap:10px;padding:12px}
.hot-side{flex:0 0 32%;display:flex}
.hot-main{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.hot-row{display:flex;gap:10px}
.hot{flex:1;min-height:76px;border-radius:12px;border:1.5px dashed #CFC6F7;background:#F9F8FF;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;color:#3B3858;font-size:12px;font-weight:700;transition:all .2s ease;min-width:0}
.hot:hover{border-color:#8F78F2;background:#F3F0FF}
.hot.is-open{border-style:solid;border-color:#4C2CD6;background:#F1EEFF;color:#2A1690}
.hot-n{width:22px;height:22px;border-radius:50%;background:#4C2CD6;color:#FFFFFF;font-size:11px;display:flex;align-items:center;justify-content:center}
.skel{height:6px;border-radius:4px;background:#E6E2F7}
.hot-panel{margin-top:12px;border-radius:14px;background:#FFFFFF;border:1px solid #8F78F2;padding:14px 16px;animation:reveal .28s ease}
.hot-panel h4{margin:0;font-size:15px;font-weight:700}
.hot-panel p{margin:6px 0 0;font-size:14px;line-height:1.55;color:#3B3858}
.hot-hint{margin-top:12px;font-size:13px;color:#575474;padding:12px 14px;border-radius:12px;border:1px dashed #D9D2FA;background:#FFFFFF}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #DCD5FB;background:#FFFFFF;color:#3B3858;font-weight:600;font-size:13px;transition:all .2s ease}
.chip:hover{border-color:#8F78F2}
.chip.is-on{background:#4C2CD6;border-color:#4C2CD6;color:#FFFFFF}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.callout{margin-top:22px;display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:18px;background:#1E1652;color:#FFFFFF}
.callout p{margin:0;font-size:16px;line-height:1.6;font-weight:500}
.callout strong{color:#C9BDFF}
.check{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:56px;border:1px solid #E4E1F5;border-radius:14px;background:#FFFFFF;cursor:pointer;transition:all .2s ease;font-size:15px;font-weight:600;color:#1A1640}
.check:hover{border-color:#CFC6F7}
.check.is-done{background:#F5F2FF;border-color:#CFC6F7;color:#4A4766}
.check.is-done .check-t{text-decoration:line-through;text-decoration-color:#9C8FE8}
.check input{width:22px;height:22px;accent-color:#4C2CD6;flex:none;margin:0;cursor:pointer}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow-step{flex:1 1 140px;min-height:64px;border-radius:14px;border:1px solid #E4E1F5;background:#FFFFFF;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:#1A1640;transition:all .2s ease}
.flow-step:hover{border-color:#CFC6F7}
.flow-step.is-open{border-color:#4C2CD6;background:#F1EEFF}
.flow-n{flex:none;width:26px;height:26px;border-radius:8px;background:#E3EDFF;color:#1D4ED8;font-size:12px;display:flex;align-items:center;justify-content:center}
.flow-step.is-open .flow-n{background:#4C2CD6;color:#FFFFFF}
.track{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.track-step{flex:1 1 150px;border-radius:16px;padding:14px;background:#FFFFFF;border:1px solid #E4E1F5;min-width:0}
.track-k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#575474}
.track-t{margin-top:6px;font-size:14px;font-weight:700;line-height:1.35}
.track-step.hl{background:linear-gradient(135deg,#4C2CD6,#2F6BFF);border-color:transparent;color:#FFFFFF}
.track-step.hl .track-k{color:#DCD5FF}
.ph-box{border:1.5px dashed #CFC6F7;background:#FBFAFF;border-radius:14px;padding:14px 16px}
.ph-k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#575474}
.ph-v{margin-top:6px;font-size:15px;font-weight:600;color:#4C2CD6}

.root{background:#FFFFFF}
.deck{min-height:100vh;display:flex;flex-direction:column;background:#FFFFFF}
.deck-top{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid #F0EEF8;flex-wrap:wrap}
.deck-logo{display:block;height:24px;width:auto}
.deck-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#575474}
.deck-tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.deck-count{font-size:13px;font-weight:700;color:#575474;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid #E4E1F5;background:#FFFFFF;color:#3B3858;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:#8F78F2;color:#4C2CD6}
.deck-bar{height:3px;background:#F0EEF8}
.deck-bar .bar-fill{border-radius:0}
.deck-body{flex:1;display:flex;min-height:0}
.rail{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 0;border-right:1px solid #F0EEF8}
.rail-btn{width:40px;height:40px;border-radius:50%;border:1px solid #E4E1F5;background:#FFFFFF;color:#7A76A0;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.rail-btn:hover{border-color:#8F78F2;color:#3A1FB0}
.rail-btn.is-done{background:#F1EEFF;color:#4C2CD6;border-color:#DCD5FB}
.rail-btn.is-current{background:#4C2CD6;color:#FFFFFF;border-color:#4C2CD6;box-shadow:0 6px 16px -6px rgba(76,44,214,.6)}
.stage{flex:1;min-width:0;padding:36px 56px 32px;max-width:1240px}
.h1,.h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:-0.01em}
.h1{font-size:56px;line-height:1.04}
.h2{font-size:44px;line-height:1.08}
.kbd-hint{display:none;margin:10px 0 0;font-size:13px;color:#575474;font-weight:500}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;border:1px solid #DCD5FB;background:#F7F5FF;color:#3A1FB0;font-size:12px;font-weight:700;margin:0 2px}
.tool-chip{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:#FFFFFF;border:1px solid #D9D2FA;font-size:14px;font-weight:700;color:#1E1450}
.tool-logo{width:28px;height:28px;border-radius:8px;object-fit:contain;flex:none}
@media (max-width:760px){.rail{display:none}.stage{padding:24px 18px 24px}.deck-top{padding:14px 18px}.deck-title{display:none}.h1{font-size:38px}.h2{font-size:32px}}
@media (max-width:640px){
.card{padding:24px 18px 20px;border-radius:20px}
.h1{font-size:32px}.h2{font-size:26px}.lead{font-size:16px}
.acc-body{padding:0 14px 14px 14px}
.nav-name{display:none}
.hot-body{flex-direction:column}.hot-side{flex:none}
}
@media (prefers-reduced-motion:reduce){.sec,.acc-body,.hot-panel{animation:none}.bar-fill,.chev{transition:none}}
</style>
<style>.kbd-hint{display:block}</style>
</head>

<!-- ============ 1. WELCOME ============ -->
<sc-if value="{{s1}}" hint-placeholder-val="{{true}}">
<section class="sec">
<div class="grid" style="margin-top: 0; align-items: center">
<div class="col-main">
<span class="eyebrow">Welcome</span>
<h1 class="h1">Welcome to Airtribe!</h1>
<p class="lead" style="font-size: 20px; color: #1A1640; font-weight: 600">Your journey to becoming an AI-First Product Manager starts here.</p>
<p class="lead">The AI-First Product Management Launchpad is a learning program that brings together product management concepts, community learning, mentorship, career roadmap sessions and AI-focused modules.</p>
<p class="lead">This guide covers the first stages of your experience — what happens during onboarding and kickoff, your first core sessions, and where to find help along the way.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; align-items: center">
<button type="button" class="btn btn-primary" onClick="{{startOnboarding}}">Start My Onboarding
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></button>
<span style="font-size: 13px; color: #575474; font-weight: 500">Opens your onboarding journey overview</span>
</div>
<p class="kbd-hint">Press <span class="kbd">→</span> or <span class="kbd">Space</span> to move forward, <span class="kbd">←</span> to go back, and <span class="kbd">F</span> for fullscreen.</p>
</div>
<div class="col-vis">
<div style="border-radius: 24px; padding: 26px; background: linear-gradient(150deg, #5B3BE8 0%, #3D52F0 60%, #2F6BFF 100%); color: #FFFFFF; position: relative; overflow: hidden">
<div style="font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #DCD5FF">Your first milestones</div>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 18px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.14)"><span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: #4C2CD6; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">1</span><span style="font-weight: 700">Onboarding Call</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.14)"><span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: #4C2CD6; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">2</span><span style="font-weight: 700">Course Kickoff</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.14)"><span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: #4C2CD6; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">3</span><span style="font-weight: 700">First Core Sessions</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.14)"><span style="width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; color: #4C2CD6; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">4</span><span style="font-weight: 700">Community Q&amp;A</span></div>
</div>
<div style="margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: #E7E2FF">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"></path><path d="M4 4h12l-2 4 2 4H4"></path></svg>
<span>One step at a time — starting here</span>
</div>
</div>
</div>
</div>
</section>
</sc-if>

<!-- ============ 2. JOURNEY ============ -->
<sc-if value="{{s2}}" hint-placeholder-val="{{false}}">
<section class="sec">
<span class="eyebrow">Overview</span>
<h2 class="h2">Your Onboarding Journey at a Glance</h2>
<p class="lead">Tap any milestone to see what it involves. Early onboarding milestones come first; later stages are shown separately so you know what comes when.</p>
<div style="max-width: 820px">
<sc-for list="{{journey}}" as="g" hint-placeholder-count="4">
<div class="phase {{g.cls}}">
<div class="phase-head"><span class="phase-tag">{{g.label}}</span><span class="phase-note">{{g.note}}</span></div>
<div class="tl">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div class="acc {{it.cls}}">
<button type="button" class="acc-head" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}">
<span class="badge">{{it.badge}}</span>
<span class="acc-titles"><span class="acc-title">{{it.title}}</span><sc-if value="{{it.hasSub}}" hint-placeholder-val="{{false}}"><span class="acc-sub">{{it.sub}}</span></sc-if></span>
<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{it.open}}" hint-placeholder-val="{{false}}">
<div class="acc-body">
<p class="acc-lead">{{it.lead}}</p>
<sc-if value="{{it.goTo}}" hint-placeholder-val="{{true}}"><button type="button" class="link-btn" onClick="{{it.goTo}}">{{it.goLabel}} →</button></sc-if>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</section>
</sc-if>

<!-- ============ 3. ONBOARDING CALL ============ -->
<sc-if value="{{s3}}" hint-placeholder-val="{{false}}">
<section class="sec">
<span class="eyebrow">Step 1 · Your Onboarding Call</span>
<h2 class="h2">Let's Get You Started!</h2>
<p class="lead">Every learner has a <strong>15-minute onboarding call</strong> with their Program Manager.</p>
<div class="grid">
<div class="col-main" style="flex: 1 1 300px">
<div class="acc-stack">
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid #E4E1F5"><span class="badge">1</span><span style="font-size: 15px; font-weight: 600; line-height: 1.5; padding-top: 6px">Learner dashboard walkthrough</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid #E4E1F5"><span class="badge">2</span><span style="font-size: 15px; font-weight: 600; line-height: 1.5; padding-top: 6px">Introduction to the course structure and learning journey</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; border: 1px solid #E4E1F5"><span class="badge">3</span><span style="font-size: 15px; font-weight: 600; line-height: 1.5; padding-top: 6px">Brief overview of what to expect throughout the program</span></div>

<div class="acc-body"><p class="acc-lead">{{it.lead}}</p></div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</section>
</sc-if>

<!-- ============ 6. CAREER ROADMAP ============ -->
<sc-if value="{{s6}}" hint-placeholder-val="{{false}}">
<section class="sec">
<span class="eyebrow">Step 4 · Discover Your Career Roadmap</span>
<h2 class="h2">Your Background. Your Path. Your Next Step.</h2>
<p class="lead">Career roadmap sessions begin around the second week of the course and may also be scheduled on weekdays. They help you understand how your existing professional experience can translate into product management.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 20px; max-width: 900px">
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; background: #F7F5FF; border: 1px solid #E8E3FB"><span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span><div><p style="margin: 0; font-size: 16px; font-weight: 800; color: #1E1450">This is a group session</p><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #3B3858">You attend your roadmap session together with other learners in the same bucket.</p></div></div>
<div style="display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; background: #F7F5FF; border: 1px solid #E8E3FB"><span class="ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8z"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg></span><div><p style="margin: 0; font-size: 16px; font-weight: 800; color: #1E1450">Recordings are shared afterwards</p><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #3B3858">Once all the roadmap sessions are done, the recordings will be shared with you.</p></div></div>
</div>
<div class="callout">
<span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9BDFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg></span>
<p>Each learner will be assigned to only <strong>ONE</strong> roadmap bucket based on their professional background. Your assigned session will be visible on your dashboard. If you believe you've been assigned to the wrong bucket, please reach out to your Program Manager.</p>
</div>
<div class="grid">
<div class="col-vis" style="flex: 1 1 320px">
<div class="panel">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 16px; font-weight: 800">Explore by background</h3><span class="tag">Illustrative guide</span></div>
<p style="margin: 6px 0 0; font-size: 13px; color: #575474; line-height: 1.5">Pick a background to open the closest roadmap category. This is not an assignment — your actual bucket appears on your dashboard.</p>
<div class="chips" role="group" aria-label="Professional background">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="15">
<button type="button" class="chip {{r.cls}}" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}">{{r.label}}</button>
</sc-for>
</div>
<sc-if value="{{hasRole}}" hint-placeholder-val="{{false}}">
<div class="hot-panel" style="padding: 12px 14px"><p style="margin: 0; font-size: 14px">{{roleText}}</p></div>
</sc-if>
</div>
</div>
<div class="col-main">
<div class="acc-stack">
<sc-for list="{{roadmaps}}" as="it" hint-placeholder-count="5">
<div class="acc {{it.cls}}">
<button type="button" class="acc-head" onClick="{{it.toggle}}" aria-expanded="{{it.expanded}}">
<span class="badge">{{it.badge}}</span>
<span class="acc-titles"><span class="acc-title">{{it.title}}</span><span class="acc-sub">{{it.sub}}</span></span>
<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{it.open}}" hint-placeholder-val="{{false}}">
<div class="acc-body">
<p class="acc-bl" style="margin-top: 0">Who it's for</p>
<ul class="acc-list"><sc-for list="{{it.bullets}}" as="b" hint-placeholder-count="3"><li>{{b}}</li></sc-for></ul>
<p class="acc-bl">Description</p>
<p class="acc-lead" style="margin-top: 6px">{{it.lead}}</p>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</section>
</sc-if>

<!-- ============ 7. WEEK 10 ============ -->
<sc-if value="{{s7}}" hint-placeholder-val="{{false}}">
<section class="sec">
<span class="eyebrow">Week 10 · AI Tools Access</span>
<h2 class="h2">Your AI Tools Access Starts in Week 10</h2>
<p class="lead">AI tools are <strong>not part of onboarding</strong>. You will receive access in <strong>Week 10</strong> of the course, when the LLMs and RAGs and AI Foundations module begins. Until then, focus on following the course journey and attending your scheduled sessions.</p>
<div style="margin-top: 22px; max-width: 760px; display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 16px; background: #EEEAFF; border: 1.5px solid #5B3BE8; color: #1E1450">
<span style="flex: 0 0 auto; min-width: 64px; height: 64px; padding: 0 10px; box-sizing: border-box; border-radius: 14px; background: #5B3BE8; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase">Week</span><span style="font-size: 26px; font-weight: 800; margin-top: 2px">10</span></span>
<div>
<p style="margin: 0; font-size: 17px; font-weight: 800; line-height: 1.3">AI tools access is given in Week 10, not before.</p>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: #3A3060">Access instructions will appear on your dashboard at that time. There is nothing you need to set up now.</p>
</div>
</div>
<div style="margin-top: 26px" class="track" aria-label="Progression to Week 10">
<div class="track-step"><div class="track-k">Now</div><div class="track-t">Onboarding &amp; first core sessions</div></div>
<div class="track-step"><div class="track-k">Around Week 2</div><div class="track-t">Career roadmap sessions begin</div></div>
<div class="track-step"><div class="track-k">Ongoing</div><div class="track-t">Core learning continues</div></div>
<div class="track-step hl"><div class="track-k">Week 10</div><div class="track-t">AI tools access is given</div></div>

<!-- ============ 8. CAPSTONE & ELIGIBILITY ============ -->
<sc-if value="{{s8}}" hint-placeholder-val="{{false}}">
<section class="sec">
<span class="eyebrow">Capstone Project · Eligibility Criteria</span>
<h2 class="h2">Know What It Takes to Reach Your Capstone.</h2>
<p class="lead">The capstone project is an <strong>end-to-end project</strong> you work on <strong>after all the core sessions are complete</strong>. To take part, and to receive career assistance afterwards, you need to meet the criteria below.</p>
<div style="margin-top: 26px" class="track" aria-label="Path to career assistance">
<div class="track-step"><div class="track-k">Step 1</div><div class="track-t">Complete all core sessions and weekly assignments</div></div>
<div class="track-step"><div class="track-k">Step 2</div><div class="track-t">Work on your end-to-end capstone project</div></div>
<div class="track-step"><div class="track-k">Step 3</div><div class="track-t">Capstone evaluation (scored out of 10)</div></div>
<div class="track-step hl"><div class="track-k">Score 7+ / 10</div><div class="track-t">Eligible for career assistance</div></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 18px">
<div style="padding: 22px; border-radius: 20px; border: 1.5px solid #5B3BE8; background: #F7F5FF">
<span class="tag" style="background: #EEEAFF; color: #3A1FB0">Eligibility 1</span>
<h3 style="margin: 12px 0 0; font-size: 20px; font-weight: 800; line-height: 1.3; color: #1E1450">To appear for the capstone project</h3>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px">
<div style="display: flex; gap: 14px; align-items: flex-start">
<span style="flex: 0 0 auto; min-width: 64px; padding: 8px 6px; box-sizing: border-box; border-radius: 12px; background: #5B3BE8; color: #FFFFFF; font-size: 20px; font-weight: 800; text-align: center">100%</span>
<div><p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; color: #1E1450">Session attendance</p><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #3A3060">Attend every session live, or go through the recordings at 1X speed.</p></div>
</div>
<div style="display: flex; gap: 14px; align-items: flex-start">
<span style="flex: 0 0 auto; min-width: 64px; padding: 8px 6px; box-sizing: border-box; border-radius: 12px; background: #5B3BE8; color: #FFFFFF; font-size: 20px; font-weight: 800; text-align: center">100%</span>
<div><p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; color: #1E1450">Weekly assignment submission</p><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #3A3060">Submit every weekly assignment.</p></div>
</div>
</div>
</div>
<div style="padding: 22px; border-radius: 20px; background: linear-gradient(150deg, #1E1652, #2B2580); color: #FFFFFF">
<span class="tag" style="background: rgba(255,255,255,.16); color: #FFFFFF">Eligibility 2</span>
<h3 style="margin: 12px 0 0; font-size: 20px; font-weight: 800; line-height: 1.3">To receive career assistance</h3>
<div style="display: flex; gap: 14px; align-items: center; margin-top: 16px">
<span style="flex: 0 0 auto; padding: 10px 14px; border-radius: 14px; background: #FFFFFF; color: #2B2580; font-size: 30px; font-weight: 800; line-height: 1">7<span style="font-size: 16px; font-weight: 700">/10</span></span>
<p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.45">Score 7 or more out of 10 in your capstone project evaluation.</p>
</div>
<p style="margin: 14px 0 0; font-size: 14px; line-height: 1.5; color: #DCD5FF">Career assistance is available only to learners who meet this score.</p>
</div>
</div>
</section>
</sc-if>

<!-- ============ 9. CHECKLIST ============ -->
<sc-if value="{{s9}}" hint-placeholder-val="{{false}}">
<section class="sec">
<span class="eyebrow">Your Onboarding Checklist</span>
<h2 class="h2">You're Ready to Get Started!</h2>
<p class="lead">Tick items off as you go. This checklist is a personal aid inside this guide only — it does not update your Airtribe dashboard.</p>
<div style="margin-top: 22px; padding: 16px 18px; border-radius: 16px; background: #F7F5FF; border: 1px solid #E8E3FB">
<div class="progress-row"><span class="progress-label">{{doneCount}} of 10 completed</span><span class="progress-meta">{{checkPct}}%</span></div>
<div class="bar" role="progressbar" aria-label="Checklist progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{doneCount}}"><div class="bar-fill" style="width: {{checkPct}}%"></div></div>
<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}"><p style="margin: 10px 0 0; font-size: 14px; font-weight: 700; color: #3A1FB0">All set — you're ready to get started!</p></sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; margin-top: 16px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="10">
<label class="check {{c.cls}}" for="{{c.id}}"><input type="checkbox" id="{{c.id}}" checked="{{c.done}}" onChange="{{c.flip}}"><span class="check-t">{{c.text}}</span></label>
</sc-for>
</div>
<div style="margin-top: 14px"><button type="button" class="link-btn" onClick="{{resetChecks}}">Clear checklist</button></div>
</section>
</sc-if>

<script>

(function(){
  class DCLogic {
    constructor(props){ this.props = props || {}; this.state = {}; }
    setState(u){
      const p = typeof u === 'function' ? u(this.state, this.props) : u;
      if (p) this.state = Object.assign({}, this.state, p);
      schedule();
    }
    forceUpdate(){ schedule(); }
  }
  window.DCLogic = DCLogic;
  
class Component extends DCLogic {

      ],

      ],

        { key: 'rm-mgmt', badge: '2', title: 'Management to PM', sub: 'Business, people and operations roles',

      ],
      roles: [['Engineer', 'tech'], ['Developer', 'tech'], ['Tester', 'tech'], ['Marketing', 'mgmt'], ['Sales', 'mgmt'], ['Human Resources', 'mgmt'], ['Business Development', 'mgmt'], ['Professor / Teacher', 'mgmt'], ['Operations', 'mgmt'], ['Graphic designer', 'design'], ['Visual designer', 'design'], ['Product Owner', 'senior'], ['Product Analyst', 'senior'], ['Associate PM (APM)', 'senior'], ['Business Analyst', 'ba']],
      continues: [
        { key: 'o1', badge: '1', title: 'Core Learning Sessions', lead: 'Core sessions continue beyond Fundamentals of Product Management. Check your dashboard for upcoming sessions.' },
        { key: 'o2', badge: '2', title: 'Assignments and Practical Application', lead: 'Completing assignments is part of how you learn. The Community Q&A helps you understand where and how to submit them.' },
        { key: 'o3', badge: '3', title: 'Mentor Interactions', lead: 'Mentorship is part of the program, starting with your Mentor Ice-Breaking Session.' },
        { key: 'o4', badge: '4', title: 'Community Engagement', lead: 'Learn alongside your cohort: ask questions and engage with fellow learners.' },
        { key: 'o5', badge: '5', title: 'Career Roadmap Sessions', lead: 'Your assigned roadmap session (one bucket, based on your background) begins around the second week and is visible on your dashboard.' },
        { key: 'o6', badge: '6', title: 'Advanced AI-Focused Learning', lead: 'AI-focused modules are part of the program, including the LLMs and RAGs and AI Foundations module in Week 10, when AI tools access begins.' }
      ],
      checklist: ['Attend my 15-minute onboarding call.', 'Explore my learner dashboard.', 'Attend the course kickoff.', 'Meet my instructors and mentors.', 'Attend Fundamentals of Product Management, Part 1 and Part 2.', 'Participate in the Mentor Ice-Breaking Session.', 'Join the Community Q&A.', 'Check my assigned career roadmap bucket on the dashboard.', 'Keep track of upcoming sessions and assignments.', 'Look out for AI tools access starting in Week 10.']
    };
    return this._c;
  }

  renderVals() {
    const C = this.content();
    const s = this.state;
    const sec = s.sec;
    const scrollUp = () => {
      const el = this.topEl;
      if (el && el.getBoundingClientRect && el.getBoundingClientRect().top < 0) el.scrollIntoView({ block: 'start', behavior: 'smooth' });
    };
    const go = (n) => () => { this.setState({ sec: n, open: null, role: null }); scrollUp(); };
    const tog = (k) => () => this.setState((p) => ({ open: p.open === k ? null : k, role: k.indexOf('rm-') === 0 ? null : p.role }));
    const st = (k) => {
      const o = s.open === k;
      return { open: o, cls: o ? 'is-open' : '', expanded: o ? 'true' : 'false', toggle: tog(k) };
    };
    const mk = (items) => items.map((it) => Object.assign({}, it, st(it.key), {
      hasSub: !!it.sub,
      hasBullets: !!(it.bullets && it.bullets.length),
      hasNote: !!it.note,
      goTo: it.goN ? go(it.goN) : null,
      goLabel: it.goN ? 'Go to section ' + it.goN : ''
    }));

    const T = {};
    ['hs1', 'hs2', 'hs3', 'hs4', 'hs5', 'w10'].forEach((k) => { T[k] = st(k); });
    const hsActive = (s.open && C.hotspots[s.open]) || null;
    const flowActive = C.flow.find((f) => f.key === s.open) || null;

    const roleRow = C.roles.find((r) => r[0] === s.role);
    const roleBucket = roleRow ? C.roadmaps.find((r) => r.key === 'rm-' + roleRow[1]) : null;

    const doneCount = C.checklist.reduce((n, _, i) => n + (s.checks[i] ? 1 : 0), 0);
    const names = C.sections;

    return {
      setTop: (el) => { this.topEl = el; },
      sec: sec,
      secPad: (sec < 10 ? '0' : '') + sec,
      toggleFs: () => { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} },
      secName: names[sec - 1],
      navPct: Math.round((sec / 10) * 100),
      nav: names.map((label, i) => ({
        n: i + 1, label: label, pad: (i + 1 < 10 ? '0' : '') + (i + 1),
        isCurrent: i + 1 === sec,
        cls: i + 1 === sec ? 'is-current' : (i + 1 < sec ? 'is-done' : ''),
        current: i + 1 === sec ? 'step' : 'false',
        aria: 'Section ' + (i + 1) + ': ' + label,
        go: go(i + 1)
      })),
      s1: sec === 1, s2: sec === 2, s3: sec === 3, s4: sec === 4, s5: sec === 5, s6: sec === 6,
      s7: sec === 7, s8: sec === 8, s9: sec === 9, s10: sec === 10,
      hasPrev: sec > 1, prevGo: go(Math.max(1, sec - 1)), prevLabel: sec > 1 ? names[sec - 2] : '',
      hasNext: sec < 10, nextGo: go(Math.min(10, sec + 1)), nextLabel: sec < 10 ? 'Next: ' + names[sec] : '',
      startOnboarding: go(2),
      backToJourney: go(2),
      journey: C.journey.map((g) => Object.assign({}, g, { items: mk(g.items) })),
      T: T,
      hasHs: !!hsActive, noHs: !hsActive, hsActive: hsActive || { title: '', body: '' },
      kickoff: mk(C.kickoff),
      core: mk(C.core),
      flow: mk(C.flow),
      hasFlow: !!flowActive, noFlow: !flowActive, flowActive: flowActive || { title: '', lead: '' },
      roadmaps: mk(C.roadmaps),
      roles: C.roles.map((r) => ({
        label: r[0],
        cls: s.role === r[0] ? 'is-on' : '',
        pressed: s.role === r[0] ? 'true' : 'false',
        pick: () => this.setState((p) => p.role === r[0] ? { role: null, open: null } : { role: r[0], open: 'rm-' + r[1] })
      })),
      hasRole: !!roleBucket,
      roleText: roleBucket ? 'Closest category for “' + s.role + '”: ' + roleBucket.title + ' (opened alongside). Your actual assignment will appear on your dashboard.' : '',
      continues: mk(C.continues),
      checks: C.checklist.map((t, i) => ({
        id: 'chk' + i, text: t, done: !!s.checks[i], cls: s.checks[i] ? 'is-done' : '',
        flip: () => this.setState((p) => { const c = Object.assign({}, p.checks); c[i] = !c[i]; return { checks: c }; })
      })),
      doneCount: doneCount,
      checkPct: Math.round((doneCount / C.checklist.length) * 100),
      allDone: doneCount === C.checklist.length,
      resetChecks: () => this.setState({ checks: {} })
    };
  }
}

  const tpl = document.getElementById('dc-template');
  const mount = document.getElementById('dc-root');
  const comp = new Component({});
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function lookup(path, scope){
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    const parts = path.split('.');
    let v;
    for (let i = scope.length - 1; i >= 0; i--) { if (scope[i] && parts[0] in scope[i]) { v = scope[i][parts[0]]; break; } }
    for (let j = 1; j < parts.length; j++) v = v == null ? undefined : v[parts[j]];
    return v;
  }
  const str = (v) => v == null || v === false ? '' : String(v);
  function renderChildren(node, scope, parent){ node.childNodes.forEach((c) => renderNode(c, scope, parent)); }
  function renderNode(node, scope, parent){
    if (node.nodeType === 3) { parent.appendChild(document.createTextNode(node.nodeValue.replace(HOLE, (_, p) => str(lookup(p, scope))))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value') || '').match(WHOLE);
      if (m && lookup(m[1], scope)) renderChildren(node, scope, parent);
      return;
    }
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list') || '').match(WHOLE);
      const as = node.getAttribute('as') || 'item';
      const list = m ? lookup(m[1], scope) : null;
      (list || []).forEach((it, i) => { const s = {}; s[as] = it; s.$index = i; renderChildren(node, scope.concat([s]), parent); });
      return;
    }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);
    let ref = null;
    for (const a of Array.from(node.attributes)) {
      const name = a.name, val = a.value;
      if (name.indexOf('hint-') === 0) continue;
      const whole = val.match(WHOLE);
      if (!whole) { el.setAttribute(name, val.indexOf('{{') >= 0 ? val.replace(HOLE, (_, p) => str(lookup(p, scope))) : val); continue; }
      const v = lookup(whole[1], scope);
      if (name.indexOf('on') === 0 && name.length > 2) { if (typeof v === 'function') el.addEventListener(name.slice(2).toLowerCase(), v); continue; }
      if (name === 'ref') { ref = v; continue; }
      if (name === 'checked') { el.checked = !!v; continue; }
      if (v == null || v === false) continue;
      el.setAttribute(name, v === true ? '' : String(v));
    }
    renderChildren(node.content || node, scope, el);
    parent.appendChild(el);
    if (typeof ref === 'function') ref(el);
  }
  let queued = false;
  function schedule(){ if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; render(); }); }
  function focusKey(el){
    if (!el || !mount.contains(el)) return null;
    const all = Array.from(mount.querySelectorAll('button, a[href], input'));
    return all.indexOf(el);
  }
  function render(){
    const fk = focusKey(document.activeElement);
    const frag = document.createDocumentFragment();
    renderChildren(tpl.content, [comp.renderVals()], frag);
    mount.replaceChildren(frag);
    if (fk != null && fk >= 0) { const all = mount.querySelectorAll('button, a[href], input'); if (all[fk]) all[fk].focus({ preventScroll: true }); }
  }
  render();
  if (comp.componentDidMount) comp.componentDidMount();
  const TOTAL = (comp.content && comp.content().sections || []).length || 10;
  const goSlide = (n) => { n = Math.max(1, Math.min(TOTAL, n)); if (n === comp.state.sec) return; comp.setState({ sec: n, open: null, role: null }); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const t = e.target; const tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && tag !== 'BUTTON' && tag !== 'A')) { e.preventDefault(); goSlide(comp.state.sec + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); goSlide(comp.state.sec - 1); }
    else if (k === 'Home') { e.preventDefault(); goSlide(1); }
    else if (k === 'End') { e.preventDefault(); goSlide(TOTAL); }
    else if (k === 'f' || k === 'F') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (err) {} }
  });
})();
